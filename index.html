<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#110a26; --card:rgba(30,20,66,.62); --ink:#eeeaff; --muted:#a69fc9;
    --violet:#7c5cf0; --blue:#4aa3ff; --gold:#e6bd72; --track:rgba(255,255,255,.09); --line:rgba(167,148,255,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    color:var(--ink); font-family:"Montserrat",system-ui,sans-serif; line-height:1.55;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:56px 20px 40px;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 88% 46%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 24% 64%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 62% 82%, rgba(255,255,255,.6), transparent),
      radial-gradient(ellipse 70% 50% at 50% -5%, rgba(124,92,240,.55), transparent 70%),
      radial-gradient(ellipse 60% 45% at 100% 100%, rgba(74,163,255,.28), transparent 70%),
      radial-gradient(ellipse 50% 40% at 0% 80%, rgba(180,70,200,.22), transparent 70%),
      var(--bg);
    background-attachment:fixed;
  }
  header{text-align:center; max-width:560px; margin-bottom:38px}
  .tag{font-family:"Syncopate",sans-serif; font-size:.62rem; letter-spacing:.5em; text-transform:uppercase; color:var(--gold); margin:0 0 14px}
  h1{
    font-family:"Syncopate","Arial",sans-serif; font-weight:700; font-size:clamp(2rem,7vw,3.1rem);
    text-transform:uppercase; letter-spacing:.14em; margin:0 0 14px; line-height:1.1;
    background:linear-gradient(180deg,#f6f3ff 0%,#b6a4ff 52%,#e6bd72 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 18px rgba(124,92,240,.55));
  }
  .rule{width:84px; height:2px; margin:0 auto 16px; background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  header p{margin:0; color:var(--muted); font-size:.95rem}
  main{width:100%; max-width:780px; display:grid; gap:22px; grid-template-columns:1fr 1fr}
  @media (max-width:680px){ main{grid-template-columns:1fr} }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 40px rgba(20,8,60,.55), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .stage{
    aspect-ratio:1/1; border-radius:12px; background:rgba(8,4,24,.55);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    color:var(--muted); text-align:center; padding:16px; font-size:.92rem;
  }
  .stage canvas{width:100%; height:100%; object-fit:cover; border-radius:12px}
  .actions{margin-top:16px}
  button{
    width:100%; font-family:"Syncopate",sans-serif; font-weight:700; font-size:.72rem;
    letter-spacing:.25em; text-transform:uppercase; cursor:pointer;
    padding:15px 20px; border:0; border-radius:999px; color:#fff;
    background:linear-gradient(135deg,var(--violet),var(--blue));
    box-shadow:0 6px 22px rgba(124,92,240,.45);
    transition:transform .15s, box-shadow .15s;
  }
  button:hover{transform:translateY(-1px); box-shadow:0 8px 28px rgba(124,92,240,.65)}
  button:disabled{opacity:.5; cursor:default; transform:none}
  h2{font-family:"Syncopate",sans-serif; font-weight:400; font-size:.62rem; letter-spacing:.45em; text-transform:uppercase; color:var(--gold); margin:0 0 8px}
  .top{
    font-family:"Syncopate",sans-serif; font-weight:700; font-size:1.45rem; text-transform:uppercase;
    letter-spacing:.08em; margin:0 0 22px; min-height:2.2rem;
    background:linear-gradient(180deg,#f6f3ff,#b6a4ff); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .row{margin-bottom:15px}
  .row .lbl{display:flex; justify-content:space-between; font-size:.85rem; margin-bottom:6px; color:var(--muted)}
  .bar{height:5px; background:var(--track); border-radius:999px; overflow:hidden}
  .fill{height:100%; width:0; background:linear-gradient(90deg,var(--violet),var(--blue)); border-radius:999px; transition:width .25s ease}
  .row.best .fill{background:linear-gradient(90deg,#b6a4ff,var(--gold))}
  .row.best .lbl{color:var(--ink); font-weight:600}
  .status{color:var(--muted); font-size:.9rem}
  footer{margin-top:34px; color:var(--muted); font-size:.68rem; letter-spacing:.3em; text-transform:uppercase; text-align:center; opacity:.8}
</style>
</head>
<body>
  <header>
    <p class="tag">Scanner online</p>
    <h1>Hero Lens</h1>
    <div class="rule"></div>
    <p>Strike a pose in front of your camera and I’ll tell you who you are.</p>
  </header>

  <main>
    <section class="card">
      <div class="stage" id="stage">Your camera will appear here</div>
      <div class="actions">
        <button id="camBtn">Start camera</button>
      </div>
    </section>

    <section class="card">
      <h2>Identified</h2>
      <p class="top" id="top">—</p>
      <div id="bars"><p class="status" id="status">Loading model…</p></div>
    </section>
  </main>

  <footer>Made with Teachable Machine</footer>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js"></script>
<script>
  // Your Teachable Machine model
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/1l8njkyHR/";

  const stage = document.getElementById("stage");
  const bars = document.getElementById("bars");
  const topEl = document.getElementById("top");
  const camBtn = document.getElementById("camBtn");

  let model, webcam = null, rafId = null;

  async function loadModel(){
    try{
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      bars.innerHTML = "";
      model.getClassLabels().forEach((name, i) => {
        const row = document.createElement("div");
        row.className = "row"; row.id = "row" + i;
        row.innerHTML = '<div class="lbl"><span></span><span>0%</span></div><div class="bar"><div class="fill"></div></div>';
        row.querySelector("span").textContent = name;
        bars.appendChild(row);
      });
    }catch(e){
      console.error(e);
      document.getElementById("status").textContent =
        "Couldn’t load the model. Check that it’s an image model and that sharing is enabled.";
    }
  }

  function show(preds){
    let best = 0;
    preds.forEach((p, i) => { if (p.probability > preds[best].probability) best = i; });
    topEl.textContent = preds[best].className;
    preds.forEach((p, i) => {
      const row = document.getElementById("row" + i);
      if (!row) return;
      const pct = Math.round(p.probability * 100);
      row.classList.toggle("best", i === best);
      row.querySelector(".lbl span:last-child").textContent = pct + "%";
      row.querySelector(".fill").style.width = pct + "%";
    });
  }

  async function loop(){
    webcam.update();
    show(await model.predict(webcam.canvas));
    rafId = requestAnimationFrame(loop);
  }

  async function toggleCamera(){
    if (!model) return;
    if (webcam){
      cancelAnimationFrame(rafId); webcam.stop(); webcam = null;
      stage.textContent = "Camera stopped"; camBtn.textContent = "Start camera"; return;
    }
    camBtn.disabled = true; camBtn.textContent = "Starting…";
    try{
      webcam = new tmImage.Webcam(400, 400, true);
      await webcam.setup(); await webcam.play();
      stage.innerHTML = ""; stage.appendChild(webcam.canvas);
      camBtn.textContent = "Stop camera";
      rafId = requestAnimationFrame(loop);
    }catch(e){
      webcam = null; camBtn.textContent = "Start camera";
      stage.textContent = "Camera unavailable. Please allow camera access.";
    }
    camBtn.disabled = false;
  }

  camBtn.addEventListener("click", toggleCamera);
  loadModel();
</script>
</body>
</html>
